[buildPlans.IosevkaBased]
  family = "Iosevka Based"
  spacing = "term"
  serifs = "sans"
  noCvSs = true
  exportGlyphNames = false
  noLigation = true

  [buildPlans.IosevkaBased.variants.design]
    one = "no-base"
    two = "curly-neck-serifless"
    three = "flat-top-serifless"
    four = "semi-open-serifless"
    five = "upright-flat-serifless"
    six = "straight-bar"
    seven = "straight-serifless-crossbar"
    eight = "two-circles"
    nine = "straight-bar"
    zero = "dotted"
    capital-a = "straight-serifless"
    capital-b = "standard-serifless"
    capital-c = "serifless"
    capital-d = "standard-serifless"
    capital-e = "serifless"
    capital-f = "serifless"
    capital-g = "toothless-rounded-serifless-hooked"
    capital-h = "serifless"
    capital-i = "serifed"
    capital-j = "serifless"
    capital-k = "symmetric-touching-serifless"
    capital-l = "serifless"
    capital-m = "hanging-serifless"
    capital-n = "standard-serifless"
    capital-p = "closed-serifless"
    capital-q = "crossing"
    capital-r = "standing-serifless"
    capital-s = "serifless"
    capital-t = "serifless"
    capital-u = "toothless-rounded-serifless"
    capital-v = "straight-serifless"
    capital-w = "straight-flat-top-serifless"
    capital-x = "straight-serifless"
    capital-y = "straight-serifless"
    capital-z = "straight-serifless"
    a = "double-storey-tailed"
    b = "toothed-serifless"
    c = "serifless"
    d = "tailed-serifless"
    e = "flat-crossbar"
    f = "flat-hook-serifless"
    g = "double-storey"
    h = "straight-serifless"
    i = "serifed-asymmetric"
    j = "serifed"
    k = "straight-serifless"
    l = "serifed-asymmetric"
    m = "serifless"
    n = "straight-serifless"
    p = "eared-serifless"
    q = "straight-serifless"
    r = "serifless"
    s = "serifless"
    t = "flat-hook-short-neck"
    u = "tailed-serifless"
    v = "straight-serifless"
    w = "straight-flat-top-serifless"
    x = "straight-serifless"
    y = "straight-turn-serifless"
    z = "straight-serifless"
    tittle = "round"
    punctuation-dot = "square"
    tilde = "low"
    asterisk = "hex-mid"
    underscore = "high"
    caret = "medium"
    ascii-grave = "straight"
    ascii-single-quote = "straight"
    paren = "normal"
    brace = "straight"
    guillemet = "straight"
    number-sign = "slanted"
    ampersand = "closed"
    at = "fourfold"
    dollar = "open"
    cent = "open-cap"
    percent = "rings-continuous-slash"
    bar = "natural-slope"
    question = "smooth"

  [buildPlans.IosevkaBased.weights.Regular]
    shape = 400
    menu = 400
    css = 400

  [buildPlans.IosevkaBased.weights.Bold]
    shape = 700
    menu = 700
    css = 700

  [buildPlans.IosevkaBased.widths.Normal]
    shape = 600
    menu = 5
    css = "normal"

  [buildPlans.IosevkaBased.slopes.Upright]
    angle = 0
    shape = "upright"
    menu = "upright"
    css = "normal"

  [buildPlans.IosevkaBased.slopes.Italic]
    angle = 9.4
    shape = "italic"
    menu = "italic"
    css = "italic"

  [buildPlans.IosevkaBased.metricOverride]
    leading = 1350
    sb = 83
    xHeight = 520
    cap = 690
    ascender = 740
    parenSize = 970

    accentWidth = 182
    accentClearance = 76
    accentHeight = 162
    accentStackOffset = 208

    essRatio = 1.03
    essRatioUpper = 1.03
    essRatioLower = 1.03
    essRatioQuestion = 1.03
    archDepth = 152
    smallArchDepth = 157
