# Label every machine except the home one, regardless of how the shell was
# opened (herdr remote panes carry no SSH_* env, so ssh_only never fires there).
[custom.remote_host]
  style = "bold"
  command = "hostname -s"
  when = '''
    h="$(hostname -s)"
    [ -n "$h" ] && [ "$h" != "lychee" ]
  '''
