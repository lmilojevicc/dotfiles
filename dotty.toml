version = 1

[packages.aerospace]
links = [{ source = ".", target = "~/.config/aerospace" }]

# Harness-neutral agent instructions, one source each (guard: tests/opencode-omni-sync.sh).
# OpenCode's omni agent reads orchestrator.md through opencode.jsonc ({file:}); the bb
# agent-instructions plugin reads it through its `file` setting.
[packages.agents]
links = [
	# Shared rules for every agent, workers included. Pi children inherit them via
	# defaultInheritGlobalContext; OpenCode loads AGENTS.md for every agent.
	{ source = "AGENTS.md", target = "~/.pi/agent/AGENTS.md" },
	{ source = "AGENTS.md", target = "~/.pi/agent-bb/AGENTS.md" },
	{ source = "AGENTS.md", target = "~/.config/opencode/AGENTS.md" },
	# Orchestrator-only rules for plain Pi. pi-subagents empties the append slot, so children never see this.
	{ source = "orchestrator.md", target = "~/.pi/agent/APPEND_SYSTEM.md" },
]

