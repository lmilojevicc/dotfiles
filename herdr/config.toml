onboarding = false

[keys]
  [[keys.command]]
    key = "ctrl+h"
    type = "plugin_action"
    command = "herdr-splits.nav-left"
    description = "Navigate left (vim/herdr)"

  [[keys.command]]
    key = "ctrl+j"
    type = "plugin_action"
    command = "herdr-splits.nav-down"
    description = "Navigate down (vim/herdr)"

  [[keys.command]]
    key = "ctrl+k"
    type = "plugin_action"
    command = "herdr-splits.nav-up"
    description = "Navigate up (vim/herdr)"

  [[keys.command]]
    key = "ctrl+l"
    type = "plugin_action"
    command = "herdr-splits.nav-right"
    description = "Navigate right (vim/herdr)"

  [[keys.command]]
    key = "alt+h"
    type = "plugin_action"
    command = "herdr-splits.resize-left"
    description = "Resize left (vim/herdr)"

  [[keys.command]]
    key = "alt+j"
    type = "plugin_action"
    command = "herdr-splits.resize-down"
    description = "Resize down (vim/herdr)"

  [[keys.command]]
    key = "alt+k"
    type = "plugin_action"
    command = "herdr-splits.resize-up"
    description = "Resize up (vim/herdr)"

  [[keys.command]]
    key = "alt+l"
    type = "plugin_action"
    command = "herdr-splits.resize-right"
    description = "Resize right (vim/herdr)"

  [[keys.command]]
    key = "prefix+f"
    type = "popup"
    width = "75%"
    height = "75%"
    command = "seshagy"

[ui]
  agent_panel_sort = "spaces"
