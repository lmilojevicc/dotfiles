# Local override for pi (FORCED — always wins over remote/bundled).
# Precedence: local override > cached remote > bundled. Remove this file to
# fall back to the herdr-maintained pi.toml.
#
# What this adds over the stock remote pi.toml:
#   - detects pi-subagents background/parallel/chain activity from the live
#     screen, generalized so it does NOT depend on the agent count.
#   - detects rpiv-ask-user-question (expanded, collapsed, free-text sentinel)
#     as blocked (approval / user input).
#
# States used:
#   working — base "Working..." indicator OR any live subagent activity signal.
#   blocked — ask-question tool chrome at the bottom of the screen.
#
# Note: pi is a lifecycle-authority agent, so the screen manifest is suppressed
# while the Pi extension's hook reports are fresh (<60s). These rules therefore
# take effect for long-running background subagents after that window, which is
# exactly the case the core events cannot see (detached children). Ask-question
# UIs may also be covered by lifecycle hooks when the extension is active; the
# blocked rules remain useful as fallback / when hooks are stale.
#
# String sources (verify on package upgrade):
#   pi-subagents@0.34.0 — status-format.ts, tui/render.ts
#   @juicesharp/rpiv-ask-user-question@1.20.0 — dialog-builder.ts, tab-content-strategy.ts
# herdr contains matching is case-insensitive.

id = "pi"
version = "2026.07.13.1"
min_engine_version = 1
updated_at = "2026-07-13T00:00:00Z"
aliases = ["herdr:pi"]

# Base rule: Pi's own streaming "Working..." indicator.
[[rules]]
  id = "working_literal"
  state = "working"
  priority = 100
  region = "whole_recent"
  visible_working = true
  contains = ["Working..."]
  not = [
    { contains = ["enter to select"] },
  ]

# pi-subagents / parallel / chain / async background activity.
# Count-agnostic: matches "1 agent running" (singular) AND "N agents running"
# (plural). Bare "async subagent" covers parallel, chain, and single-agent
# titles (e.g. "async subagent worker"). "for live detail" is keybind-agnostic
# (default "Press Ctrl+O for live detail"; expand key is remappable).
#
# Dropped vs prior override:
#   - "async subagent series" — no series mode in pi-subagents (single|parallel|chain)
#   - "press ctrl+o for live detail" — fragile case/keybind; use "for live detail"
[[rules]]
  id = "subagents_running"
  state = "working"
  priority = 300
  region = "whole_recent"
  visible_working = true
  any = [
    { contains = [
      "agent running",
    ] },
    { contains = [
      "agents running",
    ] },
    { contains = [
      "async subagent",
    ] },
    { contains = [
      "async agents",
    ] },
    { contains = [
      "for live detail",
    ] },
    { contains = [
      "subagent fleet:",
    ] },
  ]
  not = [
    { contains = ["enter to select"] },
  ]

# Expanded ask_user_question footer (always at bottom while the dialog is open).
# Core atoms always present in English expanded mode; middle segments
# (Space to toggle / n to add notes / Tab to switch questions / Ctrl+] collapse)
# are optional by buildHintText and may clip on narrow terminals — do not require them.
#
# Examples matched:
#   Enter to select · ↑/↓ to navigate · Esc to cancel
#   Enter to select · ↑/↓ to navigate · Tab to switch questions · Esc to cancel · Ctrl+] to collapse
#   Enter to select · ↑/↓ to navigate · Space to toggle · Esc to cancel · Ctrl+] to collapse
#   Enter to select · ↑/↓ to navigate · n to add notes · Esc to cancel · Ctrl+] to collapse
[[rules]]
  id = "ask_question_footer"
  state = "blocked"
  priority = 980
  region = "bottom_non_empty_lines(6)"
  visible_blocker = true
  contains = ["enter to select", "esc to cancel"]
  any = [
    { contains = [
      "↑/↓ to navigate",
    ] },
    { contains = [
      "↑↓ to navigate",
    ] },
    { contains = [
      "to navigate",
    ] },
  ]

# Collapsed questionnaire (rpiv-ask-user-question 1.14.7–1.20.x):
# single dim line "Ctrl+] to expand · Esc to cancel" while still awaiting input.
# Unreleased hide-path may remove this chrome entirely — event bridge needed then.
[[rules]]
  id = "ask_question_collapsed"
  state = "blocked"
  priority = 975
  region = "bottom_non_empty_lines(4)"
  visible_blocker = true
  contains = ["ctrl+] to expand", "esc to cancel"]

# Free-text sentinel row + cancel (stable English reserved label).
# Helps when footer is partially clipped but the Type something row remains.
[[rules]]
  id = "ask_question_type_something"
  state = "blocked"
  priority = 970
  region = "bottom_non_empty_lines(12)"
  visible_blocker = true
  contains = ["type something.", "esc to cancel"]

# Multi-question / submit-review chrome (high precision, lower recall).
[[rules]]
  id = "ask_question_review"
  state = "blocked"
  priority = 965
  region = "bottom_non_empty_lines(16)"
  visible_blocker = true
  any = [
    { contains = [
      "tab to switch questions",
    ] },
    { contains = [
      "review your answers",
    ] },
    { contains = [
      "ready to submit your answers?",
    ] },
  ]
