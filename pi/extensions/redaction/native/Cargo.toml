[package]
name = "pi-local-redaction-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "pi_redaction"
crate-type = ["rlib", "cdylib"]

[features]
default = []
node = ["dep:napi", "dep:napi-derive"]

[dependencies]
aho-corasick = "1.1.4"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
napi = { version = "2.16.17", optional = true, default-features = false, features = ["napi6", "dyn-symbols"] }
napi-derive = { version = "2.16.13", optional = true }

[build-dependencies]
napi-build = "2.2.4"

[[bin]]
name = "core-benchmark"
path = "src/bin/core-benchmark.rs"
